name: Diagnose Ubuntu 3.11 rollback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Diagnose rollback paths
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd() / "tests"))
          import test_installer_supply_chain as t

          def run_case(label, **overrides):
              print(f"\n===== {label} =====")
              with tempfile.TemporaryDirectory() as tmpdir:
                  project, home, fake_bin, old_command = t._installer_fixture(Path(tmpdir))
                  t._seed_legacy_install(home, old_command, t.DEFAULT_FILE_TOOLS)
                  result = t._run_installer(project, home, fake_bin, old_command, **overrides)
                  print("returncode:", result.returncode)
                  print("--- stdout ---")
                  print(result.stdout)
                  print("--- stderr ---")
                  print(result.stderr)
                  state = home / "claude.state"
                  print("state exists:", state.exists())
                  if state.exists():
                      print("state:", state.read_text())
                  log = home / "claude.log"
                  print("--- claude.log ---")
                  print(log.read_text() if log.exists() else "<missing>")

          run_case("failed new add", FAKE_FAIL_NEW_ADD="1")
          run_case("TERM after remove", FAKE_SIGNAL_AFTER_REMOVE="TERM")
          PY
