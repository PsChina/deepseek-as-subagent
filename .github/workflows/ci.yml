name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --require-hashes -r requirements-audit.lock
          python -m pip install -e . --no-deps

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify dependencies
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.lock

      - name: Compile package
        run: python -m compileall -q src adapters scripts

      - name: Check shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh curl-install.sh adapters/codex/install.sh adapters/codex/uninstall.sh scripts/claude_helpers.sh
