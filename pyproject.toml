[project]
name = "deepseek-as-subagent"
version = "0.1.0"
description = "MCP server that runs DeepSeek as a workspace-scoped sub-agent for Claude Code and Codex CLI."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "PsChina" }]
keywords = ["mcp", "deepseek", "claude-code", "codex-cli", "agent", "sub-agent", "llm-orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    # This codebase still uses the MCP Python SDK v1 FastMCP import path.
    # MCP SDK v2 is a breaking release (`FastMCP` -> `MCPServer`), so keep the
    # v1 maintenance line until a dedicated v2 migration is completed.
    "mcp[cli]>=1.28,<2",
    "openai>=1.40.0,<3",
    "httpx[socks]>=0.27.0,<1",  # 兼容 SOCKS 代理（科学上网环境常见）
    "google-re2>=1.1.20251105,<1.2",
]

[project.optional-dependencies]
codex = ["tomlkit>=0.13,<1"]

[project.urls]
Homepage = "https://github.com/PsChina/deepseek-as-subagent"
Repository = "https://github.com/PsChina/deepseek-as-subagent"
Issues = "https://github.com/PsChina/deepseek-as-subagent/issues"

[project.scripts]
deepseek-mcp = "deepseek_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_mcp"]
