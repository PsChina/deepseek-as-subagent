name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-audit.lock
            requirements-ci-bootstrap.lock

      - name: Create isolated test environment
        run: |
          python -m venv .ci-venv
          python -c "import os, pathlib; p = pathlib.Path('.ci-venv') / ('Scripts' if os.name == 'nt' else 'bin'); open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(str(p.resolve()) + '\n')"

      - name: Install hash-locked dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock

      - name: Install package without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Pin audited runner toolchain
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci-bootstrap.lock

      - name: Record test environment for audit
        id: target
        run: python -c "import os, sysconfig; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write('site=' + sysconfig.get_paths()['purelib'] + '\n')"

      - name: Set up Python 3.11 for audit tools
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Create isolated audit environment
        run: python -m venv .audit-venv

      - name: Install and run vulnerability scanner
        shell: bash
        env:
          TARGET_SITE: ${{ steps.target.outputs.site }}
        run: |
          AUDIT_PY=".audit-venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then AUDIT_PY=".audit-venv/Scripts/python.exe"; fi
          "$AUDIT_PY" -m pip install --only-binary=:all: --require-hashes -r requirements-ci-bootstrap.lock -r requirements-audit.lock
          "$AUDIT_PY" -m pip_audit --local --progress-spinner off
          "$AUDIT_PY" -m pip_audit --path "$TARGET_SITE" --progress-spinner off

      - name: Compile package and adapter helpers
        run: >-
          python -m compileall -q
          src/deepseek_mcp
          adapters/codex
          scripts

      - name: Validate shell installers
        shell: bash
        run: bash -n install.sh uninstall.sh scripts/claude_helpers.sh adapters/codex/install.sh adapters/codex/uninstall.sh
